[package]
name = "cortex-desktop"
version = "0.1.0"
description = "CORTEX desktop shell: your memory graph, a tray-friendly window, and cortex:// deep links."
authors = ["Aryan Sharma"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Aryan-Protein-Vala/CORTEX"
keywords = ["memory", "knowledge-graph", "tauri", "cortex"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cortex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2"
# `blocking` is deliberately absent: every core call here is async, and a
# blocking request inside the Tauri runtime is how a UI freezes on a slow LLM.
reqwest = { version = "0.13", features = ["json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
