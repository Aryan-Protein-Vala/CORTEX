version: '3.8'

services:
  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: cortex-dragonfly
    ports:
      - '6379:6379'
    volumes:
      - dragonfly-data:/data
    command: >
      --dir /data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cortex-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: cortex-surrealdb
    ports:
      - "8000:8000"
    volumes:
      - surrealdb-data:/surreal/db
    command: start --log trace --user root --pass root file:/surreal/db

volumes:
  dragonfly-data:
  qdrant-data:
  surrealdb-data:
