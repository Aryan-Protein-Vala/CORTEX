// STATUS: design artifact. Nothing in this repository compiles it.
// There is no build.rs and no tonic codegen, and src/api/sync.rs answers
// 'not implemented' for CRDT replication, so this file exists only to keep a
// canonical mesh message definition around until someone ships the transport.
// Do not re-add tonic/prost to Cargo.toml until a build.rs consumes this.

syntax = "proto3";

package cortex.sync;

service CortexCloud {
  // Sync the local memory graph to the cloud instance
  rpc SyncGraph (SyncRequest) returns (SyncResponse);
}

message SyncRequest {
  string user_id = 1;
  // A CRDT (Conflict-free Replicated Data Type) vector clock payload
  bytes crdt_payload = 2; 
  int64 timestamp = 3;
}

message SyncResponse {
  bool success = 1;
  int64 server_timestamp = 2;
  // Any remote changes that need to be merged back into the local Qdrant/SurrealDB
  bytes merge_payload = 3;
}
