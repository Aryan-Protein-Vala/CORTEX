[package]
name = "cortex-core"
version = "0.1.0"
description = "Local-first memory graph for AI: capture, extract, decay, recall."
authors = ["Aryan Sharma"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Aryan-Protein-Vala/CORTEX"
edition = "2021"

# `--bin cortex-core` is what the docs, scripts and CI use, so it is declared
# rather than inferred from the package name.
[[bin]]
name = "cortex-core"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database clients — all optional at runtime (the session buffer in storage/session.rs
# replaced the old Redis/Dragonfly working-memory path, and that module is gone).
# Surreal/Qdrant light up only when their env vars are set; the default backend is a JSON file.
surrealdb = "1.5"
qdrant-client = "1.7"

# HTTP API
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "timeout", "limit", "trace", "catch-panic"] }

# RPC
tonic = "0.10"
prost = "0.12"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
base64 = "0.21"

[profile.release]
# Small, deterministic single-binary builds for the installer path. A panic in a
# handler is still caught (CatchPanicLayer) because unwinding is left enabled.
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
# Drives the router in-process (no socket) for the API contract tests.
tower = { version = "0.7", features = ["util"] }
http-body-util = "0.1"
