<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cortex Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="logo">Cortex<span>.</span></span>
      <span id="status-indicator" class="status pulse">● CHECKING CORE...</span>
    </div>
    
    <div class="content">
      <p class="eyebrow">HIVE MIND CONNECTION</p>
      <div class="stat-box">
        <span class="label">Core Latency</span>
        <span id="latency-val" class="value mono">...</span>
      </div>
      <div class="stat-box">
        <span class="label">Context Budget</span>
        <span class="value mono">500 tk</span>
      </div>
    </div>
    
    <div class="footer">
      <button id="sync-btn" class="button">Force Sync Memory</button>
      <p class="micro">Permanent memory. Universal AI protocol.</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
